
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMIR DESIGN STUDIO</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(ellipse at center, #101d43 0%, #050914 55%, #000 100%);
  font-family: Arial, sans-serif;
  color: white;
}

.scene {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.orbit {
  position: absolute;
  width: 310px;
  height: 310px;
  border: 2px solid rgba(0,130,255,.8);
  border-radius: 50%;
  box-shadow: 0 0 25px #087cff, inset 0 0 25px #087cff;
  animation: appear 2s ease forwards, rotate 12s linear infinite;
  opacity: 0;
}

.logo {
  z-index: 2;
  width: 150px;
  height: 150px;
  border: 2px solid #168cff;
  border-radius: 34px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 76px;
  font-weight: 900;
  color: white;
  background: linear-gradient(145deg, #123b85, #050b19);
  box-shadow: 0 0 50px #087cff;
  animation: logoIn 1.5s cubic-bezier(.2,.8,.2,1) forwards;
  transform: scale(.2);
  opacity: 0;
}

.name {
  z-index: 2;
  margin-top: 55px;
  font-size: clamp(22px, 5vw, 42px);
  font-weight: 800;
  letter-spacing: 8px;
  animation: textIn 1.5s 1s ease forwards;
  opacity: 0;
  transform: translateY(20px);
}

.subtitle {
  z-index: 2;
  margin-top: 15px;
  font-size: 12px;
  letter-spacing: 6px;
  color: #61aaff;
  animation: textIn 1.5s 1.5s ease forwards;
  opacity: 0;
  transform: translateY(20px);
}

.line {
  position: absolute;
  width: 150%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #168cff, transparent);
  animation: sweep 5s linear infinite;
}

.line.one { top: 25%; }
.line.two { top: 75%; animation-delay: 2s; }

@keyframes appear {
  to { opacity: 1; }
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes logoIn {
  to { transform: scale(1); opacity: 1; }
}

@keyframes textIn {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes sweep {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

@media (max-width: 500px) {
  .orbit { width: 260px; height: 260px; }
  .logo { width: 125px; height: 125px; font-size: 62px; }
  .name { letter-spacing: 4px; }
}
</style>
</head>
<body>
<div class="scene">
  <div class="line one"></div>
  <div class="line two"></div>
  <div class="orbit"></div>
  <div class="logo">A</div>
  <div class="name">AMIR</div>
  <div class="subtitle">DESIGN STUDIO</div>
</div>
</body>
</html>
